name: Build Android Debug APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" \
            "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "${BASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${BASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$TEMPLATE_DIR/"
          godot --version

      - name: Create debug keystore and Godot editor settings
        run: |
          set -euo pipefail
          KS="$HOME/debug.keystore"
          keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${KS}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          # strip the heredoc indentation
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.3.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Diagnostics
        run: |
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" | head -40
          cat "$HOME/.config/godot/editor_settings-4.3.tres"
          ls "$ANDROID_HOME" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/ndk" || true
          ls -la "$HOME/debug.keystore"

      - name: Export debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/Touch-Frogert-debug.apk
          ls -la build
          test -s build/Touch-Frogert-debug.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/Touch-Frogert-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/Touch-Frogert-debug.apk | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Touch-Frogert-debug
          path: build/Touch-Frogert-debug.apk
          if-no-files-found: error
